<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mision 2 - Hugo</title>
    <link rel="icon" href="src/img/miniatura.png">
    <link rel="stylesheet" href="src/style.css">
    <script type="module" src="/src/app.js"></script>
</head>

<body>

    <header>
        <h1>COMIDAS</h1>
        <p>Comidas del mundo</p>
    </header>

    <main>

        <section class="inicio">
            
            <label for="buscador">Buscar comida:</label> <!-- Etiqueta que identifica el campo de busqueda -->
            <input id="buscador"> <!-- Campo para escribir -->

        </section>

        <p id="mensaje"></p>

        <section id="comidas">

            <section id="lista-comidas" class="comidas">

                <article class="comida">
                    <h3>España</h3>
                    <img src="src/img/1.png" alt="España">
                    <button class="comprar">Receta</button>
                </article>
                
                <article class="comida">
                    <h3>Italia</h3>
                    <img src="src/img/2.webp" alt="Italia">
                    <button class="comprar">Receta</button>
                </article>

                <article class="comida">
                    <h3>Japon</h3>
                    <img src="src/img/3.webp" alt="Japon">
                    <button class="comprar">Receta</button>
                </article>

                <article class="comida">
                    <h3>China</h3>
                    <img src="src/img/4.webp" alt="China">
                    <button class="comprar">Receta</button>
                </article>

                <article class="comida">
                    <h3>Peru</h3>
                    <img src="src/img/5.png" alt="Peru">
                    <button class="comprar">Receta</button>
                </article>

                <article class="comida">
                    <h3>Vietnam</h3>
                    <img src="src/img/6.webp" alt="Vietnam">
                    <button class="comprar">Receta</button>
                </article>

            </section>

            <section id="resultados"></section>
            
        </section>

        <section id="aleatorio">
            <button id="boton">Comida aleatoria</button>
        </section>

    </main>

    <footer>
        <p>Mision 2 - Async Odyssey / Hugo Cobos Gutierrez INSO3ºB</p>
    </footer>

</body>
</html>
